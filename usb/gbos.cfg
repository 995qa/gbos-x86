# gbos USB debug boot options (shell syntax, edit on any computer)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none
# Load i915 for the UHD 620. Set to 0 if the screen freezes right after "modprobe i915".
LOAD_I915=1
# Load Intel Wi-Fi driver (firmware is not packaged yet, so it will likely complain)
LOAD_WIFI=0
# Seconds to pause before handing over to Android init (time to read the screen)
EXTRA_SLEEP=0
# MODE: boot (run gbos from this stick) | install (ERASE the internal NVMe and install gbos to it;
# asks you to type the disk's serial number first). The installed copy always boots normally.
MODE=install
# Display density (dpi). Google's default is 260 (too big on this 13.3" 1080p screen).
# Lower = smaller, more on screen. Try 160-200. Takes effect on the next boot after an update.
DENSITY=180
