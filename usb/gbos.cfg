# gbOS86 boot options (shell syntax, edit on any computer)
# SHELL_AT: none | early (before drivers) | pre_android (Android root mounted at /new)
SHELL_AT=none
# Load i915 for the UHD 620. Set to 0 if the screen freezes right after "modprobe i915".
LOAD_I915=1
# Load Intel Wi-Fi driver (firmware is not packaged yet, so it will likely complain)
LOAD_WIFI=0
# Seconds to pause before handing over to Android init (time to read the screen)
EXTRA_SLEEP=0
# MODE: what booting this USB does.
#   ask     show the gbOS86 menu: live / install-or-update / boot the installed system (default)
#   live    run gbOS86 live from the USB (nothing saved)
#   install go straight to the installer/updater (it asks before erasing anything)
#   boot    boot the installed system if there is one, else live
MODE=ask
# Display density (dpi). Unset = Google's stock 260 (too big here); lower = smaller. 180 suits this screen.
DENSITY=180
# Make everything smaller WITHOUT changing density: Android renders at this size and the display
# scales it to the 1920x1080 panel. Bigger = smaller UI (2400x1350 is ~20% smaller, 2880x1620 ~33%).
# Empty = native 1920x1080. Keep 16:9. Takes effect after an update boot.
RESOLUTION=

# Installer target: the internal NVMe or eMMC disk, or a SATA disk (M.2 SATA / 2.5") when there is no NVMe/eMMC. SD cards, USB disks and the
# stick are never targets. With more than one internal disk the installer refuses; name the one to erase here (e.g. nvme0n1, mmcblk0 or
# sda; sda is the only way to pick a SATA disk when an NVMe is also present). The serial number is still typed before anything is written.
#INSTALL_DISK=mmcblk0

# REQUIRE_AVX=1 (default): stop with a message when the CPU has no AVX (Google's init dies on its first instruction there,
# otherwise a silent hang). 0 = boot anyway.
REQUIRE_AVX=1

# GPU_SOFTWARE=auto (default): render on the CPU when the laptop has no Intel GPU (AMD Radeon / Ryzen): Google's image only has
# an Intel graphics driver, so hook.sh swaps in SwiftShader (a CPU Vulkan driver) and a libgbm that can allocate buffers on amdgpu.
# Slow (the CPU draws everything) but it shows a desktop. Never changes anything on an Intel laptop in auto mode.
# 1 = use it even on an Intel GPU (for testing), 0 = never. Logged as "hook: software rendering: ..." in logs/boot-N.
GPU_SOFTWARE=auto

# HWDETECT=1 (default): at boot, detect the laptop's hardware and load the matching drivers from gbos/modules with
# firmware from gbos/firmware (Wi-Fi, Bluetooth, sound, touchpad, hotkeys, brightness, ...). Report: logs/boot-N/hwdetect.txt.
# Set 0 for the original Latitude 5300 sequence (iwlmvm + btusb from the stick, no gbos/modules coldplug).
HWDETECT=1

# Bind the SHA-NI/VNNI-free libz + libcrypto before stage0's dmctl runs (saves ~2 s of trapped SHA at boot).
# Harmless if the file is missing; hook.sh patches later anyway.
[ -f /gbos/gbos/early_patch.sh ] && . /gbos/gbos/early_patch.sh

# XE_PARAMS: module parameters for the xe graphics driver (Lunar Lake and newer; older Intel GPUs use i915), loaded before the
# coldplug. On the Surface Laptop 7 the screen showed ghost images ("3D glasses") and froze: the log had "Selective fetch area
# calculation failed in pipe A" (PSR2) followed by "CPU pipe A FIFO underrun". "enable_psr=0 enable_fbc=0" fixed it. Unset = defaults.
#XE_PARAMS="enable_psr=0 enable_fbc=0"

# DEVICE_MODEL: name shown as "Model" and "Device name" in Settings > About (ro.product.model / ro.product.marketname, and
# Settings.Global.device_name set after boot). Unset = Google's own. Only the model strings change, not the build fingerprint.
#DEVICE_MODEL="Surface Laptop 7"
